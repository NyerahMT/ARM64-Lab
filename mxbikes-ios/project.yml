name: MXBViewportPrototype
options:
  bundleIdPrefix: com.nyerahworks
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  MXBViewportPrototype:
    type: application
    platform: iOS
    sources:
      - path: ios/MXBViewportPrototype
        excludes:
          - Info.plist
          - Bridge.h
      - path: runtime/mxb_gl_surface.c
      - path: runtime/mxb_gl_win64_abi.c
      - path: runtime/mxb_gl_texture.c
      - path: runtime/mxb_gl_texture.h
        buildPhase: headers
      - path: runtime/mxb_gl_texture_probe.c
      - path: runtime/mxb_gl_texture_probe.h
        buildPhase: headers
      - path: runtime/mxb_gl_indexed_probe.c
      - path: runtime/mxb_gl_indexed_probe.h
        buildPhase: headers
      - path: runtime/mxb_gl_win64_abi.h
        buildPhase: headers
      - path: runtime/mxb_gl_surface.h
        buildPhase: headers
      - path: runtime/mxb_observed_runtime.c
      - path: runtime/mxb_observed_memory.c
      - path: runtime/mxb_observed_imports.c
      - path: runtime/mxb_observed_graphics.c
      - path: runtime/mxb_observed_graphics.h
        buildPhase: headers
      - path: runtime/mxb_observed_session.c
      - path: runtime/mxb_observed_session.h
        buildPhase: headers
      - path: runtime/mxb_standalone_crt.c
      - path: runtime/mxb_standalone_crt.h
        buildPhase: headers
      - path: runtime/mxb_standalone_platform.c
      - path: runtime/mxb_standalone_platform.h
        buildPhase: headers
      - path: runtime/mxb_standalone_heap.c
      - path: runtime/mxb_standalone_heap.h
        buildPhase: headers
      - path: runtime/mxb_standalone_memory.c
      - path: runtime/mxb_standalone_memory.h
        buildPhase: headers
      - path: runtime/mxb_standalone_imports.c
      - path: runtime/mxb_standalone_imports.h
        buildPhase: headers
      - path: runtime/mxb_standalone_winsock.c
      - path: runtime/mxb_standalone_winsock.h
        buildPhase: headers
      - path: runtime/mxb_standalone_format.c
      - path: runtime/mxb_standalone_format.h
        buildPhase: headers
      - path: runtime/mxb_standalone_files.c
      - path: runtime/mxb_standalone_files.h
        buildPhase: headers
      - path: runtime/mxb_standalone_asset_session.c
      - path: runtime/mxb_standalone_asset_session.h
        buildPhase: headers
      - path: runtime/mxb_standalone_winmain.c
      - path: runtime/mxb_standalone_winmain.h
        buildPhase: headers
    info:
      path: ios/MXBViewportPrototype/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nyerahworks.mxbviewportprototype
        SWIFT_OBJC_BRIDGING_HEADER: ios/MXBViewportPrototype/Bridge.h
        CODE_SIGNING_ALLOWED: "NO"

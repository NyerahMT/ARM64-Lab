      - "scripts/mxbikes_crc_cluster_bridge.h"
      - "scripts/mxbikes_native_file_crc_chain.h"
      - "scripts/mxbikes_native_file_crc_chain.py"
      - "scripts/mxbikes_native_file_crc_single.py"
      - "scripts/mxbikes_postseek_original_cfg.py"
      - "scripts/mxbikes_original_postseek_native.py"

name: MX Bikes - current native startup frontier

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/mxbikes-startup-native-fast.yml"
      - "scripts/mxbikes_main_callee_*.py"
      - "scripts/mxbikes_main_postreturn_filename_native.py"
      - "scripts/mxbikes_main_boot_helper_native.py"
      - "scripts/mxbikes_main_boot_strcpy_native.py"
      - "scripts/mxbikes_main_boot_first_jcc_native.py"
      - "scripts/mxbikes_main_boot_filename_loop_native.py"
      - "scripts/mxbikes_main_boot_cwd_native.py"
      - "scripts/mxbikes_main_boot_next_call_native.py"
      - "scripts/mxbikes_main_boot_init_callee_native.py"
      - "scripts/mxbikes_init_nested_wave.py"
      - "scripts/mxbikes_init_nested_jle_native.py"
      - "scripts/mxbikes_init_child_successor_wave.py"

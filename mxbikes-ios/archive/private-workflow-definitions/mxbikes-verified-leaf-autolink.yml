name: MX Bikes - verified native leaf autolink

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/mxbikes-verified-leaf-autolink.yml"
      - "scripts/mxbikes_verified_leaf_autolink.py"
      - "scripts/mxbikes_leaf_pattern_survey.py"
      - "scripts/mxbikes_memory_leaf_autolink.py"
      - "scripts/mxbikes_multistore_autolink.py"

permissions:
  contents: read

concurrency:
  group: mxbikes-verified-leaf-autolink
  cancel-in-progress: true

jobs:
  verify-and-link:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout private original-game harness
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned native guest linker
        uses: actions/checkout@v4
        with:
          repository: NyerahMT/ARM64-Lab
          ref: a167fe5502500bdddf64baae8c8b9abfdfc978ad
          path: arm64-lab
          persist-credentials: false
      - name: Install x64 emulator and native ARM64 linker toolchain
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'capstone>=5,<6' 'unicorn>=2,<3' 'pyelftools>=0.31,<1'
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends clang lld
      - name: Extract SHA-verified original game privately
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-leafs" "$RUNNER_TEMP/native-leaf-report"
          gh release download Mxbikes1 --repo "$GITHUB_REPOSITORY" \
            --pattern Game.zip --dir "$RUNNER_TEMP/native-leafs"
          python - <<'PY'
          import hashlib,os,pathlib,shutil,zipfile
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"native-leafs"
          with zipfile.ZipFile(root/"Game.zip") as z:
              matching=[x for x in z.infolist() if not x.is_dir()
                        and pathlib.PurePosixPath(x.filename.replace("\\","/")).name.lower()=="mxbikes.exe"]
              if len(matching)!=1 or matching[0].file_size>750*1024**2:
                  raise RuntimeError("Missing or oversized original MX Bikes executable")
              with z.open(matching[0]) as src,(root/"mxbikes.exe").open("wb") as dst:
                  shutil.copyfileobj(src,dst)
          if hashlib.sha256((root/"mxbikes.exe").read_bytes()).hexdigest()!="4ae7de3854b4d0a18271679fb57a1f2fdf0b21804417b85dd82055078ea123b6":
              raise RuntimeError("Original executable digest mismatch")
          (root/"Game.zip").unlink()
          PY
      - name: Survey short original leaf patterns without asserting conversion
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/arm64-lab" python scripts/mxbikes_leaf_pattern_survey.py \
            "$RUNNER_TEMP/native-leafs/mxbikes.exe" \
            "$RUNNER_TEMP/native-leaf-report"
          cat "$RUNNER_TEMP/native-leaf-report/native-leaf-pattern-survey.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Discover, execute, compile and auto-register real leaf functions
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/arm64-lab" python scripts/mxbikes_verified_leaf_autolink.py \
            "$RUNNER_TEMP/native-leafs/mxbikes.exe" \
            "$RUNNER_TEMP/native-leaf-report"
          cat "$RUNNER_TEMP/native-leaf-report/verified-leaf-auto-link.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Batch verify and dispatch original guest-memory leaf functions
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/arm64-lab" python scripts/mxbikes_memory_leaf_autolink.py \
            "$RUNNER_TEMP/native-leafs/mxbikes.exe" \
            "$RUNNER_TEMP/native-leaf-report"
          cat "$RUNNER_TEMP/native-leaf-report/memory-leaf-native.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Execute multistep MOV/XOR originals through native ARM64 guest linker
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/arm64-lab" python scripts/mxbikes_multistore_autolink.py \
            "$RUNNER_TEMP/native-leafs/mxbikes.exe" \
            "$RUNNER_TEMP/native-leaf-report"
          cat "$RUNNER_TEMP/native-leaf-report/multistore-native-differential.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload metadata and verification manifest only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-original-native-leaf-autolink
          path: ${{ runner.temp }}/native-leaf-report/
          if-no-files-found: warn
          retention-days: 14

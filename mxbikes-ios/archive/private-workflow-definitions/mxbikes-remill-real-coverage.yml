name: MX Bikes - original Remill LLVM coverage

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/mxbikes-remill-real-coverage.yml"
      - "scripts/mxbikes_remill_real_targets.py"
      - "scripts/mxbikes_remill_crt_probe.py"
      - "scripts/mxbikes_crt_guest_memory.c"
      - "scripts/mxbikes_crt_x64_reference.py"

permissions:
  contents: read

jobs:
  remill-original-functions:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE: trailofbits/remill:llvm1100-ubuntu20.04-amd64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: NyerahMT/ARM64-Lab
          path: arm64-lab
          persist-credentials: false
      - name: Install LLVM 14 and pull existing pinned Remill image
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends llvm-14 clang lld
          python -m pip install --disable-pip-version-check 'capstone>=5,<6' 'unicorn>=2,<3' 'pyelftools>=0.31,<1'
          docker pull "$IMAGE"
      - name: Extract SHA-verified original game only in private runner
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/game" "$RUNNER_TEMP/inputs" "$RUNNER_TEMP/report"
          chmod 0777 "$RUNNER_TEMP/inputs"
          gh release download Mxbikes1 --repo "$GITHUB_REPOSITORY" --pattern Game.zip --dir "$RUNNER_TEMP/game"
          python - <<'PY'
          import os,pathlib,zipfile,shutil,hashlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"game"
          with zipfile.ZipFile(root/"Game.zip") as z:
              items=[x for x in z.infolist() if not x.is_dir() and pathlib.PurePosixPath(x.filename.replace("\\","/")).name.lower()=="mxbikes.exe"]
              if len(items)!=1 or items[0].file_size>750*1024**2:raise RuntimeError("Unexpected original EXE")
              with z.open(items[0]) as src,(root/"mxbikes.exe").open("wb") as dst:shutil.copyfileobj(src,dst)
          digest=hashlib.sha256((root/"mxbikes.exe").read_bytes()).hexdigest()
          if digest!="4ae7de3854b4d0a18271679fb57a1f2fdf0b21804417b85dd82055078ea123b6":raise RuntimeError("Original EXE SHA mismatch")
          (root/"Game.zip").unlink()
          PY
          python scripts/mxbikes_remill_real_targets.py "$RUNNER_TEMP/game/mxbikes.exe" "$RUNNER_TEMP/inputs"

      - name: Lift nine authentic bounded function bodies to LLVM IR in isolated container
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --memory 3g --cpus 2 \
            --mount type=bind,source="$RUNNER_TEMP/inputs",target=/mnt/work \
            --tmpfs /tmp:rw,nosuid,nodev,size=128m \
            --entrypoint /bin/sh "$IMAGE" -c '
              set -eu
              lift="$(find /opt /usr/local -maxdepth 7 -type f -name "remill-lift*" -perm /111 -print -quit 2>/dev/null)"
              test -n "$lift"
              for input in /mnt/work/*.hex; do
                stem="$(basename "$input" .hex)"
                if "$lift" --arch amd64 --ir_out "/mnt/work/$stem.ll" --bytes "$(cat "$input")" > "/mnt/work/$stem.stdout-internal" 2> "/mnt/work/$stem.stderr-internal"; then
                  echo ok > "/mnt/work/$stem.lift-status"
                else
                  echo failed > "/mnt/work/$stem.lift-status"
                fi
              done
              # Contrast full bodies against first instruction and initial
              # sequential basic block; neither source nor IR leaves CI.
              for input in /mnt/work/*.first /mnt/work/*.basic; do
                if [ ! -s "$input" ]; then continue; fi
                stem="$(basename "$input")"
                "$lift" --arch amd64 --ir_out "/mnt/work/$stem.ll" --bytes "$(cat "$input")" > "/mnt/work/$stem.stdout-internal" 2> "/mnt/work/$stem.stderr-internal" || true
              done
            '
          test "$(find "$RUNNER_TEMP/inputs" -name '*.lift-status' | wc -l)" -eq 9

      - name: Verify generated LLVM modules and AArch64 machine objects
        run: |
          set -euo pipefail
          for input in "$RUNNER_TEMP/inputs/"*.hex; do
            stem="$(basename "$input" .hex)"
            base="$RUNNER_TEMP/inputs/$stem"
            if [ "$(cat "$base.lift-status")" != ok ] || [ ! -s "$base.ll" ];then
              echo no_ir > "$base.compile-status";continue
            fi
            if ! llvm-as-14 "$base.ll" -o "$base.bc" > "$base.llvm.stdout" 2> "$base.llvm.stderr";then
              echo bad_ir > "$base.compile-status";continue
            fi
            if ! opt-14 -verify -disable-output "$base.bc" >> "$base.llvm.stdout" 2>> "$base.llvm.stderr";then
              echo invalid_ir > "$base.compile-status";continue
            fi
            if ! llc-14 -mtriple=aarch64-unknown-linux-gnu -filetype=obj "$base.bc" -o "$base.arm64.o" >> "$base.llvm.stdout" 2>> "$base.llvm.stderr";then
              echo no_arm_obj > "$base.compile-status";continue
            fi
            if ! readelf -h "$base.arm64.o" | grep -q 'Machine:.*AArch64';then
              echo wrong_arch > "$base.compile-status";continue
            fi
            echo pass > "$base.compile-status"
          done

      - name: Audit native runtime dependencies for original CRT function
        run: |
          set -euo pipefail
          obj="$RUNNER_TEMP/inputs/crt-security-cookie-initializer.arm64.o"
          ir="$RUNNER_TEMP/inputs/crt-security-cookie-initializer.ll"
          test -s "$obj"
          test -s "$ir"
          echo "=== Unresolved native runtime symbol names (not original code bytes) ==="
          llvm-nm-14 --undefined-only "$obj"
          echo "=== Remill runtime declaration names and types ==="
          python - <<'PY'
          import os,pathlib,re
          ir=(pathlib.Path(os.environ["RUNNER_TEMP"])/"inputs/crt-security-cookie-initializer.ll").read_text()
          for line in ir.splitlines():
              if line.startswith("declare ") and ("@__remill_" in line or "@llvm." in line):
                  print(line[:500])
          print("missing-block references:", ir.count("@__remill_missing_block"))
          print("defined functions:",len(re.findall(r"(?m)^define ",ir)))
          PY
      - name: Verify authentic original x64 CRT early-branch reference
        run: |
          set -euo pipefail
          python scripts/mxbikes_crt_x64_reference.py \
            "$RUNNER_TEMP/game/mxbikes.exe" "$RUNNER_TEMP/report"
      - name: Execute bounded original CRT Remill AArch64 path (fail closed)
        run: |
          set -euo pipefail
          python scripts/mxbikes_remill_crt_probe.py \
            "$RUNNER_TEMP/inputs/crt-security-cookie-initializer.ll" \
            "$RUNNER_TEMP/report"
          cat "$RUNNER_TEMP/report/remill-crt-probe.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Summarize only sanitized feasibility metadata
        run: |
          python - <<'PY'
          import os,pathlib,json,collections,subprocess,hashlib,re
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          inp=root/"inputs"
          entries=json.loads((inp/"manifest-private.json").read_text())
          result=[]
          for x in entries:
              stem=inp/x["name"]
              lift=pathlib.Path(str(stem)+".lift-status").read_text().strip()
              stage=pathlib.Path(str(stem)+".compile-status").read_text().strip()
              ir=pathlib.Path(str(stem)+".ll")
              obj=pathlib.Path(str(stem)+".arm64.o")
              rec={"name":x["name"],"rva":x["rva"],"bytes":x["byte_length"],
                   "evidence":x["boundary_evidence"],"remill":lift,"arm64":stage,
                   "ir_size":ir.stat().st_size if ir.is_file() else 0,
                   "obj_size":obj.stat().st_size if obj.is_file() else 0}
              rec["original_x64_instruction_count"]=x["instruction_count"]
              rec["initial_basic_block_instruction_count"]=x["initial_block_instruction_count"]
              rec["initial_control_instruction"]=x["first_control_mnemonic"]
              first_ir=pathlib.Path(str(stem)+".first.ll")
              basic_ir=pathlib.Path(str(stem)+".basic.ll")
              rec["first_instruction_ir_obtained"]=first_ir.is_file() and first_ir.stat().st_size>0
              rec["initial_basic_block_ir_obtained"]=basic_ir.is_file() and basic_ir.stat().st_size>0
              def digest(file):
                  return hashlib.sha256(file.read_bytes()).hexdigest()
              rec["full_ir_identical_to_first_instruction"]=(digest(ir)==digest(first_ir) if ir.is_file() and first_ir.is_file() else None)
              rec["full_ir_identical_to_initial_block"]=(digest(ir)==digest(basic_ir) if ir.is_file() and basic_ir.is_file() else None)
              if ir.is_file():
                  text_ir=ir.read_text(errors="replace")
                  rec["llvm_define_count"]=len(re.findall(r"(?m)^define ",text_ir))
                  rec["mentions_missing_block"]=("__remill_missing_block" in text_ir)
              if stage=="pass":
                  check=subprocess.run(["llvm-nm-14","--undefined-only",str(obj)],capture_output=True,text=True,check=True)
                  syms=set(line.split()[-1] for line in check.stdout.splitlines() if line.strip())
                  rec["undefined_runtime_count"]=len(syms)
              result.append(rec)
          counts=collections.Counter(x["arm64"] for x in result)
          report={"source":"Original MX Bikes PE revision verified; inputs and derived objects private",
                  "total_original_function_bodies":len(result),
                  "llvm_ir_success":sum(x["remill"]=="ok" for x in result),
                  "aarch64_objects_compiled":counts["pass"],
                  "full_ir_equals_first_block_count":sum(x["full_ir_identical_to_initial_block"] is True for x in result),
                  "full_ir_equals_first_instruction_count":sum(x["full_ir_identical_to_first_instruction"] is True for x in result),
                  "results":result,
                  "arm64_executed":False,"original_game_booted":False,
                  "limitations":"Research-only legacy Remill LLVM 11 / LLVM 14. Original function execution and runtime semantics NOT proven."}
          folder=root/"report"
          (folder/"original-remill-coverage.json").write_text(json.dumps(report,indent=2)+"\n")
          lines=["# Remill / LLVM / ARM64 feasibility on nine original MX Bikes code bodies","",
                 f"- Original bodies selected: {len(result)}",
                 f"- Remill IR outputs: **{report['llvm_ir_success']}**",
                 f"- Native AArch64 object files compiled: **{counts['pass']}**",
                 f"- Full IR identical to initial sequential basic-block IR: **{report['full_ir_equals_first_block_count']}** / {len(result)}",
                 f"- Full IR identical to first-instruction IR: **{report['full_ir_equals_first_instruction_count']}** / 8","",
                 "| Function | x64 insns | Initial block insns | ARM64 object | Full IR equals first block? |",
                 "| --- | ---: | ---: | --- | --- |"]
          for r in result:
              lines.append(f"| {r['name']} ({r['rva']}) | {r['original_x64_instruction_count']} | {r['initial_basic_block_instruction_count']} | {r['arm64']} | {r['full_ir_identical_to_initial_block']} |")
          lines+=["","**Equal IR with an initial block suggests limited first-trace coverage, not necessarily full-function lifting. Differences do not prove complete control-flow recovery. No lifted game code executed.**",""]
          summary="\n".join(lines)
          (folder/"original-remill-coverage.md").write_text(summary)
          print(summary)
          PY
          cat "$RUNNER_TEMP/report/original-remill-coverage.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mxbikes-remill-original-coverage
          path: ${{ runner.temp }}/report/
          if-no-files-found: warn
          retention-days: 7

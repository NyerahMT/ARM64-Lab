name: MX Bikes — standalone environment regressions
on:
  workflow_dispatch:
  push:
    branches: [feat/mxb-demo-crt-startup-20261125]
    paths:
      - '.github/workflows/mxbikes-standalone-environment-tests.yml'
      - 'mxbikes-ios/scripts/mxb_demo_win64_environment.py'
      - 'mxbikes-ios/scripts/mxbikes_public_demo_entry.py'
      - 'mxbikes-ios/tests/test_mxbikes_public_demo_entry.py'
permissions:
  contents: read
jobs:
  environment-regressions:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Execute source-only checked process environment tests
        run: |
          python -m pip install --disable-pip-version-check unicorn==2.1.4 capstone==5.0.9
          python -m unittest discover -v -s mxbikes-ios/tests -p 'test_mxbikes_public_demo_entry.py'

name: Remill lifted synthetic x64 executed on native AArch64

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/remill-runtime-execute.yml"
      - "tools/remill_synthetic_exec.py"

permissions:
  contents: read

jobs:
  real-remill-arm64-execution:
    runs-on: ubuntu-22.04
    timeout-minutes: 16
    env:
      IMAGE: trailofbits/remill:llvm1100-ubuntu20.04-amd64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install LLVM14 and Python emulator
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends llvm-14 clang lld
          python -m pip install --disable-pip-version-check 'unicorn>=2,<3' 'pyelftools>=0.31,<1' 'capstone>=5,<6'
          docker pull "$IMAGE"
          mkdir -p "$RUNNER_TEMP/synthetic-ir" "$RUNNER_TEMP/synthetic-report"
          chmod 0777 "$RUNNER_TEMP/synthetic-ir"
      - name: Lift one synthetic x64 store instruction in network-isolated Remill container
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --memory 2g --cpus 1 \
            --mount type=bind,source="$RUNNER_TEMP/synthetic-ir",target=/mnt/out \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            --entrypoint /bin/sh "$IMAGE" -c '
              set -eu
              lift="$(find /opt /usr/local -maxdepth 7 -type f -name "remill-lift*" -perm /111 -print -quit 2>/dev/null)"
              test -n "$lift"
              "$lift" --arch amd64 --ir_out /mnt/out/synthetic.ll \
                --bytes c704ba01000000 >/tmp/lift.stdout 2>/tmp/lift.stderr
              test -s /mnt/out/synthetic.ll
              grep -q "^define " /mnt/out/synthetic.ll
            '
      - name: Link guest-memory runtime and execute actual lifted ARM64 code
        run: |
          set -euo pipefail
          python -m tools.remill_synthetic_exec "$RUNNER_TEMP/synthetic-ir/synthetic.ll" \
            > "$RUNNER_TEMP/synthetic-report/remill-exec.json"
          python - <<'PY'
          import pathlib,os,json
          folder=pathlib.Path(os.environ["RUNNER_TEMP"])/"synthetic-report"
          data=json.loads((folder/"remill-exec.json").read_text())
          lines=["# Remill x64 → LLVM → linked native AArch64 execution","",
                "- Original instruction: purpose-built synthetic x64 MOV DWORD [RDX+4*RDI],1",
                "- Unicorn x64 reference write: address 0, value 1",
                "- Remill instruction output: native ARM64 ELF with helper symbols linked",
                "- ARM64 Unicorn code executed and memory-helper effects matched: "+str(data["guest_memory_address_and_value_matched"]),
                "- ARM64 program exit status: "+str(data["arm64_unicorn_smoke_return"]),
                "",
                "**A bounded synthetic single-instruction runtime proof, not original game ARM64 execution or iOS.**",""]
          text="\n".join(lines)
          (folder/"remill-exec.md").write_text(text)
          print(text)
          with pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as f:f.write(text)
          PY
      - name: Upload synthetic-only outcome metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remill-aarch64-execution-proof
          path: |
            ${{ runner.temp }}/synthetic-report/remill-exec.json
            ${{ runner.temp }}/synthetic-report/remill-exec.md
          if-no-files-found: warn
          retention-days: 7

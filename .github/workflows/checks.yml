name: ARM64 Lab checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install disassembler
        run: python -m pip install 'capstone>=5,<6'
      - name: Test safe local tooling
        run: python -m unittest discover -s tests -v
      - name: Generate tiny synthetic lift
        run: python -m tools.leaf_lift --hex b8ffffffffc3 --emit-c /tmp/lift.c
      - name: Cross-compile to AArch64 ELF object
        run: |
          clang --target=aarch64-unknown-linux-gnu -ffreestanding -c /tmp/lift.c -o /tmp/lift.o
          readelf -h /tmp/lift.o | grep -q 'Machine:.*AArch64'
      - name: Check no proprietary binary inputs were committed
        run: |
          if git ls-files | grep -iE '\.(exe|dll|dli|dlo|pkz|ipa|pdb|dmp)$'; then
            echo 'Game binary accidentally tracked'; exit 1
          fi

name: ARM64 Lab checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install disassembler
        run: python -m pip install 'capstone>=5,<6' 'unicorn>=2,<3' 'pyelftools>=0.31,<1'
      - name: Test safe local tooling
        run: python -m unittest discover -s tests -v
      - name: Generate tiny synthetic lift
        run: python -m tools.leaf_lift --hex b8ffffffffc3 --emit-c /tmp/lift.c
      - name: Cross-compile to AArch64 ELF object
        run: |
          clang --target=aarch64-unknown-linux-gnu -ffreestanding -c /tmp/lift.c -o /tmp/lift.o
          readelf -h /tmp/lift.o | grep -q 'Machine:.*AArch64'
      - name: Test Windows-compatible timing services on native host
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Iruntime \
            runtime/mx_time_compat.c tests/test_mx_time_compat.c \
            -o /tmp/mx_time_compat_test
          /tmp/mx_time_compat_test
      - name: Cross-compile timing services for AArch64
        run: |
          clang --target=aarch64-unknown-linux-gnu -ffreestanding -std=c11 \
            -Wall -Wextra -Werror -Iruntime -c runtime/mx_time_compat.c \
            -o /tmp/mx_time_compat_aarch64.o
          readelf -h /tmp/mx_time_compat_aarch64.o | grep -q 'Machine:.*AArch64'
      - name: Test Win64 guest import dispatch with fake guest memory
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Iruntime \
            runtime/mx_time_compat.c runtime/mx_guest_imports.c \
            tests/test_mx_guest_imports.c -o /tmp/mx_import_dispatch_test
          /tmp/mx_import_dispatch_test
      - name: Cross-compile Win64 guest import dispatch to AArch64
        run: |
          clang --target=aarch64-unknown-linux-gnu -ffreestanding -std=c11 \
            -Wall -Wextra -Werror -Iruntime -c runtime/mx_guest_imports.c \
            -o /tmp/mx_import_dispatch_aarch64.o
          readelf -h /tmp/mx_import_dispatch_aarch64.o | grep -q 'Machine:.*AArch64'
      - name: Test typed Win64 import registry on native host
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Iruntime \
            runtime/mx_time_compat.c runtime/mx_guest_imports.c \
            runtime/mx_import_registry.c tests/test_mx_import_registry.c \
            -o /tmp/mx_import_registry_test
          /tmp/mx_import_registry_test
      - name: Verify bounded CRT GS and exclusive CMPXCHG64 primitives
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -Iruntime \
            tests/test_mx_crt_primitives.c -o /tmp/mx_crt_primitives_test
          /tmp/mx_crt_primitives_test
          clang --target=aarch64-unknown-linux-gnu -ffreestanding \
            -fno-stack-protector -O2 -std=c11 -Wall -Wextra -Werror \
            -Iruntime -c tests/test_mx_crt_primitives.c \
            -o /tmp/mx_crt_primitives_arm64.o
          readelf -h /tmp/mx_crt_primitives_arm64.o | grep -q 'Machine:.*AArch64'
      - name: Cross-compile native import registry to AArch64
        run: |
          clang --target=aarch64-unknown-linux-gnu -ffreestanding -std=c11 \
            -Wall -Wextra -Werror -Iruntime \
            -c runtime/mx_import_registry.c \
            -o /tmp/mx_import_registry_aarch64.o
          readelf -h /tmp/mx_import_registry_aarch64.o | grep -q 'Machine:.*AArch64'
      - name: Cross-architecture x64-to-ARM64 native import differential proof
        run: |
          python -m tools.import_aot_smoke --output-dir /tmp/win64-import-aot-proof
          cat /tmp/win64-import-aot-proof/import-aot-proof.md >> "$GITHUB_STEP_SUMMARY"
      - name: Differentially execute synthetic signed x64 backward loop on AArch64
        run: |
          python -m tools.loop_differential /tmp/mx-loop-differential
          cat /tmp/mx-loop-differential/loop-differential.md >> "$GITHUB_STEP_SUMMARY"
      - name: Test two truly linked translated Win64 functions on ARM64
        run: |
          python -m tools.linked_call_differential /tmp/mx-linked-call-differential
          cat /tmp/mx-linked-call-differential/linked-calls.md >> "$GITHUB_STEP_SUMMARY"
      - name: Check no proprietary binary inputs were committed
        run: |
          if git ls-files | grep -iE '\.(exe|dll|dli|dlo|pkz|ipa|pdb|dmp)$'; then
            echo 'Game binary accidentally tracked'; exit 1
          fi

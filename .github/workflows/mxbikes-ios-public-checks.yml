name: MX Bikes iOS — public source-only checks

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "mxbikes-ios/**"
      - ".github/workflows/mxbikes-ios-public-checks.yml"
  push:
    branches: [main, public/mxbikes-ios-source]
    paths:
      - "mxbikes-ios/**"
      - ".github/workflows/mxbikes-ios-public-checks.yml"

permissions:
  contents: read

jobs:
  cpu-graphics-and-win64-abi:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mxbikes-ios
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run native host GL and guest-ABI smoke tests
        run: |
          set -euo pipefail
          cc -O2 -std=c11 -Wall -Wextra -Werror -Iruntime \
            runtime/mxb_gl_surface.c tests/mxb_gl_surface_smoke.c \
            -lm -o /tmp/mxb-gl-surface
          /tmp/mxb-gl-surface
          cc -O2 -std=c11 -Wall -Wextra -Werror -Iruntime \
            runtime/mxb_gl_surface.c runtime/mxb_gl_win64_abi.c \
            tests/mxb_gl_win64_abi_smoke.c \
            -lm -o /tmp/mxb-gl-abi
          /tmp/mxb-gl-abi
          cc -O2 -std=c11 -Wall -Wextra -Werror -Iruntime \
            runtime/mxb_gl_surface.c runtime/mxb_gl_win64_abi.c \
            runtime/mxb_gl_indexed_probe.c tests/mxb_gl_indexed_fixture_smoke.c \
            -lm -o /tmp/mxb-gl-indexed
          /tmp/mxb-gl-indexed
          cc -O2 -std=c11 -Wall -Wextra -Werror -Iruntime \
            runtime/mxb_gl_texture.c runtime/mxb_gl_texture_probe.c \
            tests/mxb_gl_texture_batch_smoke.c \
            -o /tmp/mxb-gl-texture
          /tmp/mxb-gl-texture
      - name: Install authentic guest-runtime Python dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            'unicorn>=2,<3' 'capstone>=5,<6' 'pyelftools>=0.31,<1'
      - name: Validate local owned-game runner without commercial files
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_mxbikes_run_owned_local.py -v
          python -m unittest discover -s tests -p test_mxbikes_standalone_import_audit.py -v
          python -m unittest discover -s tests -p test_mxbikes_real_frame_frontier.py -v
          python -m unittest discover -s tests -p test_mxbikes_real_runtime_imports.py -v
          python -m unittest discover -s tests -p test_mxbikes_steam_call_contract.py -v
          python -m unittest discover -s tests -p test_mxbikes_offline_relaunch_experiment.py -v
          python -m unittest discover -s tests -p test_mxbikes_steam_failure_path.py -v
          python -m unittest discover -s tests -p test_mxbikes_steam_branch_import_provenance.py -v
          python -m unittest discover -s tests -p test_mxbikes_steam_context_layout.py -v
          python -m unittest discover -s tests -p test_mxbikes_steam_offline_research.py -v
          python -m unittest discover -s tests -p test_mxbikes_steam_original_native_branch.py -v
          python -m unittest discover -s tests -p test_mxbikes_steam_winmm_time_probe.py -v
          python -m unittest discover -s tests -p test_mxbikes_crt_guest_malloc_research.py -v
          python -m unittest discover -s tests -p test_mxbikes_winsock_startup_research.py -v
          python -m unittest discover -s tests -p test_mxbikes_winsock_getaddrinfo_research.py -v
          python -m unittest discover -s tests -p test_mxbikes_winsock_followup_nameinfo.py -v
          python -m unittest discover -s tests -p test_mxbikes_winsock_followup_pton.py -v
          python -m unittest discover -s tests -p test_mxbikes_winsock_freeaddrinfo_research.py -v
          python -m unittest discover -s tests -p test_mxbikes_winsock_ntohl_research.py -v
          python -m unittest discover -s tests -p test_mxbikes_crt_sprintf_ipv4.py -v
          python -m unittest discover -s tests -p test_mxbikes_crt_third_memset_research.py -v
          python -m unittest discover -s tests -p test_mxbikes_crt_fourth_memset_research.py -v
          python -m unittest discover -s tests -p test_mxbikes_crt_fifth_memset_research.py -v
          python -m unittest discover -s tests -p test_mxbikes_crt_second_malloc_research.py -v
          python -m unittest discover -s tests -p test_mxbikes_crt_sixth_memset_research.py -v
          python -m unittest discover -s tests -p test_mxbikes_crt_bounded_image_memset.py -v
          python -m unittest discover -s tests -p test_mxbikes_crt_followup_malloc.py -v
          python -m unittest discover -s tests -p test_mxbikes_core_ini_owned_stream.py -v
          python -m unittest discover -s tests -p test_mxbikes_win32_owned_core_ini.py -v
          python -m unittest discover -s tests -p test_mxbikes_win32_core_filetime.py -v
          python -m unittest discover -s tests -p test_mxbikes_win32_core_closehandle.py -v
          python -m unittest discover -s tests -p test_mxbikes_crt_zero_memmove.py -v
          python -m unittest discover -s tests -p test_mxbikes_crt_followup_heap_memset.py -v
          python -m unittest discover -s tests -p test_mxbikes_crt_small_memcpy.py -v
      - name: Differential-check original post-Steam timer semantics on host and AArch64
        run: |
          set -euo pipefail
          python scripts/mxbikes_poststeam_timer_differential.py --source-only
          python scripts/mxbikes_poststeam_joined_differential.py --source-only
          python scripts/mxbikes_native_slice_lift.py --source-only
          python scripts/mxbikes_native_cfg_lift.py --source-only
          python scripts/mxbikes_native_cfg_lift.py --source-only --imports-fixture
          python scripts/mxbikes_native_cfg_lift.py --source-only --imports-fixture --emit-module "$RUNNER_TEMP/mxb-native-probe.c"
          diff -u runtime/generated/mxb_native_probe.c "$RUNNER_TEMP/mxb-native-probe.c"
          python scripts/mxbikes_native_module_smoke.py
          echo "Public fixture: source-only timer semantics, NOT original x64 proof." >> "$GITHUB_STEP_SUMMARY"
      - name: Build native post-Steam timer translator for iOS ARM64 Mach-O target
        run: |
          set -euo pipefail
          clang --target=arm64-apple-ios17.0 -std=c11 -O2 -ffreestanding             -Wall -Wextra -Werror -Iruntime             -c runtime/mxb_poststeam_timer_native.c             -o /tmp/mxb_poststeam_timer_ios_arm64.o
          file /tmp/mxb_poststeam_timer_ios_arm64.o | grep -E 'Mach-O.*arm64'
          clang --target=arm64-apple-ios17.0 -std=c11 -O2 -ffreestanding \
            -Wall -Wextra -Werror -Iruntime \
            -c runtime/mxb_poststeam_helper_entry_native.c \
            -o /tmp/mxb_poststeam_helper_entry_ios_arm64.o
          file /tmp/mxb_poststeam_helper_entry_ios_arm64.o | grep -E 'Mach-O.*arm64'
          echo "iOS-target native object compiled; no signed IPA or device boot claimed." >> "$GITHUB_STEP_SUMMARY"
      - name: Execute synthetic x64-to-native OpenGL import tests
        run: |
          set -euo pipefail
          python tests/mxb_gl_win64_unicorn_import_test.py
          python tests/mxb_gl_win64_indexed_guest_test.py
      - name: Execute full Win64 graphics ABI fixture as native AArch64 ELF
        run: |
          set -euo pipefail
          python tests/mxb_gl_native_arm64_test.py
          echo "Native AArch64 renderer and Win64 ABI fixture executed under Unicorn; no original game code or assets." >> "$GITHUB_STEP_SUMMARY"
      - name: Cross-compile native renderer and guest adapter for ARM64
        run: |
          set -euo pipefail
          for name in mxb_gl_surface mxb_gl_win64_abi mxb_gl_texture \
                      mxb_gl_indexed_probe mxb_gl_texture_probe; do
            clang --target=aarch64-none-elf -std=c11 -O2 -ffreestanding \
              -fno-builtin -Wall -Wextra -Werror -Iruntime \
              -c "runtime/${name}.c" -o "/tmp/${name}-aarch64.o"
            readelf -h "/tmp/${name}-aarch64.o" | grep -q AArch64
          done
          echo "Source-only ARM64/Win64 graphics tests passed. No original game code or assets were used." >> "$GITHUB_STEP_SUMMARY"

  # Compile the actual SwiftUI/MetalKit XcodeGen project and linked native
  # timer translation. This is a signed-out synthetic viewport build,
  # NOT execution of the commercial MX Bikes game.
  ios-viewport-unsigned-simulator-build:
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mxbikes-ios
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ensure project generator is available
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version
      - name: Compile and run offscreen Metal shader readback probe when GPU is available
        run: |
          set -euo pipefail
          swiftc tests/mxb_metal_offscreen_probe.swift -framework Metal -o "$RUNNER_TEMP/mxb-metal-readback"
          "$RUNNER_TEMP/mxb-metal-readback" ios/MXBViewportPrototype/Shader.metal
      - name: Generate actual iOS viewport Xcode project
        run: xcodegen generate --spec project.yml
      - name: Build unsigned iOS Simulator app including native post-Steam timer C
        run: |
          set -euo pipefail
          xcodebuild \
            -project MXBViewportPrototype.xcodeproj \
            -scheme MXBViewportPrototype \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/mxb-ios-simulator-build" \
            CODE_SIGNING_ALLOWED=NO \
            build > "$RUNNER_TEMP/mxb-ios-build.log" 2>&1 || {
              tail -n 160 "$RUNNER_TEMP/mxb-ios-build.log"
              exit 1
            }
          echo "Unsigned iOS Simulator viewport project compiled including original post-Steam native C translator." >> "$GITHUB_STEP_SUMMARY"
          echo "Original-game engine is not connected; no real frame or signed IPA." >> "$GITHUB_STEP_SUMMARY"
      - name: Compile unsigned iPhone arm64 device-target application
        run: |
          set -euo pipefail
          xcodebuild \
            -project MXBViewportPrototype.xcodeproj \
            -scheme MXBViewportPrototype \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/mxb-ios-device-build" \
            CODE_SIGNING_ALLOWED=NO \
            build > "$RUNNER_TEMP/mxb-iphone-build.log" 2>&1 || {
              tail -n 160 "$RUNNER_TEMP/mxb-iphone-build.log"
              exit 1
            }
          echo "Unsigned iPhone device-target app compiled with Swift/C post-Steam bridge." >> "$GITHUB_STEP_SUMMARY"
          echo "No Apple signature, physical iPhone test, original game engine or original game frame." >> "$GITHUB_STEP_SUMMARY"


name: MX Bikes iOS — public source-only checks

on:
  workflow_dispatch:
  push:
    branches: [main, public/mxbikes-ios-source]
    paths:
      - "mxbikes-ios/**"
      - ".github/workflows/mxbikes-ios-public-checks.yml"

permissions:
  contents: read

jobs:
  cpu-graphics-and-win64-abi:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mxbikes-ios
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run native host GL and guest-ABI smoke tests
        run: |
          set -euo pipefail
          cc -O2 -std=c11 -Wall -Wextra -Werror -Iruntime \
            runtime/mxb_gl_surface.c tests/mxb_gl_surface_smoke.c \
            -lm -o /tmp/mxb-gl-surface
          /tmp/mxb-gl-surface
          cc -O2 -std=c11 -Wall -Wextra -Werror -Iruntime \
            runtime/mxb_gl_surface.c runtime/mxb_gl_win64_abi.c \
            tests/mxb_gl_win64_abi_smoke.c \
            -lm -o /tmp/mxb-gl-abi
          /tmp/mxb-gl-abi
          cc -O2 -std=c11 -Wall -Wextra -Werror -Iruntime \
            runtime/mxb_gl_surface.c runtime/mxb_gl_win64_abi.c \
            runtime/mxb_gl_indexed_probe.c tests/mxb_gl_indexed_fixture_smoke.c \
            -lm -o /tmp/mxb-gl-indexed
          /tmp/mxb-gl-indexed
          cc -O2 -std=c11 -Wall -Wextra -Werror -Iruntime \
            runtime/mxb_gl_texture.c runtime/mxb_gl_texture_probe.c \
            tests/mxb_gl_texture_batch_smoke.c \
            -o /tmp/mxb-gl-texture
          /tmp/mxb-gl-texture
      - name: Install authentic guest-runtime Python dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            'unicorn>=2,<3' 'capstone>=5,<6' 'pyelftools>=0.31,<1'
      - name: Validate local owned-game runner without commercial files
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_mxbikes_run_owned_local.py -v
          python -m unittest discover -s tests -p test_mxbikes_standalone_import_audit.py -v
          python -m unittest discover -s tests -p test_mxbikes_real_frame_frontier.py -v
          python -m unittest discover -s tests -p test_mxbikes_real_runtime_imports.py -v
          python -m unittest discover -s tests -p test_mxb_gl_callsite.py -v
          python -m unittest discover -s tests -p test_mxb_demo_win64_environment.py -v
          python -m unittest discover -s tests -p test_mxbikes_public_demo_entry.py -v
          python -m unittest discover -s tests -p test_mxbikes_steam_call_contract.py -v
      - name: Execute synthetic x64-to-native OpenGL import tests
        run: |
          set -euo pipefail
          python tests/mxb_gl_win64_unicorn_import_test.py
          python tests/mxb_gl_win64_indexed_guest_test.py
      - name: Cross-compile native renderer and guest adapter for ARM64
        run: |
          set -euo pipefail
          for name in mxb_gl_surface mxb_gl_win64_abi mxb_gl_texture \
                      mxb_gl_indexed_probe mxb_gl_texture_probe; do
            clang --target=aarch64-none-elf -std=c11 -O2 -ffreestanding \
              -fno-builtin -Wall -Wextra -Werror -Iruntime \
              -c "runtime/${name}.c" -o "/tmp/${name}-aarch64.o"
            readelf -h "/tmp/${name}-aarch64.o" | grep -q AArch64
          done
          echo "Source-only ARM64/Win64 graphics tests passed. No original game code or assets were used." >> "$GITHUB_STEP_SUMMARY"

  native-arm64-graphics:
    # Execute on an actual ARM64 runner; cross-compilation alone proves no runtime behavior.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mxbikes-ios
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify host architecture and execute renderer smoke tests
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          cc -O2 -std=c11 -Wall -Wextra -Werror -Iruntime \
            runtime/mxb_gl_surface.c tests/mxb_gl_surface_smoke.c \
            -lm -o /tmp/mxb-arm64-surface
          /tmp/mxb-arm64-surface
          cc -O2 -std=c11 -Wall -Wextra -Werror -Iruntime \
            runtime/mxb_gl_surface.c runtime/mxb_gl_win64_abi.c \
            tests/mxb_gl_win64_abi_smoke.c \
            -lm -o /tmp/mxb-arm64-abi
          readelf -h /tmp/mxb-arm64-abi | grep -q AArch64
          /tmp/mxb-arm64-abi
          cc -O2 -std=c11 -Wall -Wextra -Werror -Iruntime \
            runtime/mxb_gl_surface.c runtime/mxb_gl_win64_abi.c \
            runtime/mxb_gl_indexed_probe.c tests/mxb_gl_indexed_fixture_smoke.c \
            -lm -o /tmp/mxb-arm64-indexed
          /tmp/mxb-arm64-indexed
          cc -O2 -std=c11 -Wall -Wextra -Werror -Iruntime \
            runtime/mxb_gl_texture.c runtime/mxb_gl_texture_probe.c \
            tests/mxb_gl_texture_batch_smoke.c \
            -o /tmp/mxb-arm64-texture
          /tmp/mxb-arm64-texture
          echo "Native AArch64 renderer tests passed with synthetic fixture data only." >> "$GITHUB_STEP_SUMMARY"

  ios-metal-build:
    # Standard public macOS runner: no private-repository minutes or assets.
    runs-on: macos-15
    timeout-minutes: 12
    defaults:
      run:
        working-directory: mxbikes-ios
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build source-only iOS Metal simulator target
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate --spec project.yml
          xcodebuild -project MXBViewportPrototype.xcodeproj -scheme MXBViewportPrototype -configuration Debug -sdk iphonesimulator -derivedDataPath "$RUNNER_TEMP/mxb-ios" CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/mxb-ios.log" 2>&1 || { tail -80 "$RUNNER_TEMP/mxb-ios.log"; exit 1; }
          tail -8 "$RUNNER_TEMP/mxb-ios.log"
          echo "iOS Metal simulator compilation passed. No private inputs, game assets, or original executable used." >> "$GITHUB_STEP_SUMMARY"
